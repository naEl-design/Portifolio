<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shingiro Nael | Frontend Developer &amp; UI/UX Designer</title>
    <meta
      name="description"
      content="Portfolio of Shingiro Nael, a Frontend Developer and UI/UX Designer based in Kigali, Rwanda, specializing in responsive web development and intuitive digital experiences."
    />
    <meta property="og:title" content="Shingiro Nael | Frontend Developer & UI/UX Designer" />
    <meta
      property="og:description"
      content="Portfolio of Shingiro Nael, a Frontend Developer and UI/UX Designer based in Kigali, Rwanda, specializing in responsive web development and intuitive digital experiences."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('nael_theme');
          var root = document.documentElement;
          if (saved === 'light') {
            root.classList.remove('dark');
          } else if (saved === 'dark') {
            root.classList.add('dark');
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            root.classList.remove('dark');
          } else {
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-slate-900 dark:bg-[#06110C] dark:text-white antialiased selection:bg-[#EA580C] selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
